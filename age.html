<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Age Calculator | ToolHub</title>

<link rel="stylesheet"
href="age.css">

</head>

<body>

<header>

<h1>🎂 Age Calculator</h1>

<p>Find your exact age instantly.</p>

<a href="index.html"
class="home-btn">

← Back to ToolHub

</a>

</header>

<div class="container">

<h2>Select Your Birthday</h2>

<input
type="date"
id="birthDate">

id="calculateBtn">

🎉 Calculate Age

</button>

<div id="result">

<span id="years">0</span></p>

<p>Months:
<span id="months">0</span></p>

<span id="days">0</span></p>

<span id="birthday">0</span>

</div>

</div>
