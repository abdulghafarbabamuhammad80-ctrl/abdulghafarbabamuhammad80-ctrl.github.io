<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Age Calculator | ToolHub</title>

    <link rel="stylesheet" href="age.css">
</head>

<body>

    <main class="age-page">

        <header class="tool-header">
            <div class="tool-icon">🎂</div>

            <h1>Age Calculator</h1>

            <p>Discover your exact age in years, months and days.</p>

            <a href="index.html" class="home-btn">
                ← Back to ToolHub
            </a>
        </header>

        <section class="calculator-card">

            <div class="card-heading">
                <span class="section-icon">📅</span>

                <div>
                    <h2>Select Your Birthday</h2>
                    <p>Enter your date of birth to calculate your age.</p>
                </div>
            </div>

            <div class="input-group">
                <label for="birthDate">Date of Birth</label>

                <input
                    type="date"
                    id="birthDate"
                    aria-label="Date of Birth"
                >
            </div>

            <button
                id="calculateBtn"
                class="calculate-btn"
                type="button"
            >
                🎉 Calculate Age
            </button>

            <section
                id="result"
                class="result-card"
                aria-live="polite"
            >

                <div class="result-title">
                    <span>✨</span>
                    <h2>Your Age</h2>
                </div>

                <div class="age-results">

                    <div class="age-box">
                        <span id="years">0</span>
                        <small>Years</small>
                    </div>

                    <div class="age-box">
                        <span id="months">0</span>
                        <small>Months</small>
                    </div>

                    <div class="age-box">
                        <span id="days">0</span>
                        <small>Days</small>
                    </div>

                </div>

                <div class="birthday-result">
                    🎂 Next Birthday In:
                    <strong>
                        <span id="birthday">0</span> days
                    </strong>
                </div>

            </section>

        </section>

    </main>

    <script src="age.js"></script>

</body>
</html>
