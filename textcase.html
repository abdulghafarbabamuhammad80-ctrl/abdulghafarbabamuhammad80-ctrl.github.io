<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text Case Converter - ToolHub</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="hero">

<h1>📝 Text Case Converter</h1>

<p>Convert text instantly.</p>

</div>

</header>

<main>

<div class="tool-card">

<textarea
id="textInput"
rows="10"
placeholder="Type or paste your text here..."
></textarea>

<div class="button-grid">

<button id="upperBtn">UPPERCASE</button>

<button id="lowerBtn">lowercase</button>

<button id="titleBtn">Title Case</button>

<button id="sentenceBtn">Sentence case</button>

<button id="invertBtn">Invert Case</button>

<button id="copyBtn">Copy</button>

<button id="clearBtn">Clear</button>

</div>

<p id="textStats">

Characters: 0 | Words: 0

</p>

</div>

</main>

<script src="textcase.js"></script>

</body>

</html>
