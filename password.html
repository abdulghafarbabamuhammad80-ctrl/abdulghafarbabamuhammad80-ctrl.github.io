<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator | ToolHub</title>
    <link rel="stylesheet" href="password.css">
</head>
<body>

<header>
    <h1>🔑 Password Generator</h1>
    <p>Create strong and secure passwords instantly.</p>
    <a href="index.html" class="home-btn">← Back to ToolHub</a>
</header>

<div class="container">

    <div class="password-box">
    <input type="password" id="password" readonly placeholder="Your password will appear here">
    <button id="togglePassword">👁️ Show</button>
</div>

    <button id="copy">📋 Copy</button>

    <div class="setting">
        <label>Password Length</label>
        <input type="range" id="length" min="4" max="50" value="16">
        <span id="lengthValue">16</span>
    </div>

    <div class="setting">
        <label><input type="checkbox" id="uppercase" checked> Uppercase Letters</label>
    </div>

    <div class="setting">
        <label><input type="checkbox" id="lowercase" checked> Lowercase Letters</label>
    </div>

    <div class="setting">
        <label><input type="checkbox" id="numbers" checked> Numbers</label>
    </div>

    <div class="setting">
        <label><input type="checkbox" id="symbols" checked> Symbols</label>
    </div>

    <button id="generate">⚡ Generate Password</button>

    <div class="strength">
    <p>Password Strength</p>

    <div class="strength-bar">
        <div id="strengthFill"></div>
    </div>

    <span id="strength">Strong 💪</span>
</div>
<h3>🕒 Recent Passwords</h3>
<h3>📊 Password Statistics</h3>

<div class="stats">

    <p>Length: <span id="statLength">0</span></p>

    <p>Uppercase: <span id="statUpper">0</span></p>

    <p>Lowercase: <span id="statLower">0</span></p>

    <p>Numbers: <span id="statNumber">0</span></p>

    <p>Symbols: <span id="statSymbol">0</span></p>

</div>
<h3>🛡️ Password Health</h3>

<div class="health-card">

    <h2><span id="healthScore">0</span>/100</h2>

    <ul id="healthTips">
        <li>Generate a password to see its score.</li>
    </ul>

</div>
<div id="history"></div>
</div>

<script src="password.js"></script>

</body>
</html>
