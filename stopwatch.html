<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Stopwatch & Timer | ToolHub</title>

<link rel="stylesheet"
href="stopwatch.css">

</head>

<body>

<header>

<h1>⏱️ Stopwatch & Timer</h1>

<p>Measure time with precision.</p>

<a href="index.html"
class="home-btn">

← Back to ToolHub

</a>

</header>

<div class="container">

<h2>Stopwatch</h2>

<div id="display">

00:00:00

</div>

<div class="buttons">

<button id="startBtn">
▶ Start
</button>

<button id="pauseBtn">
⏸ Pause
</button>

<button id="resetBtn">
🔄 Reset
</button>

<button id="lapBtn">
🏁 Lap
</button>

</div>

<h3>Lap Times</h3>

<ul id="laps">

<li>No laps yet.</li>

</ul>

<hr>

<h2>Timer</h2>

<input
type="number"
id="minutes"
placeholder="Minutes">

<input
type="number"
id="seconds"
placeholder="Seconds">

<button id="timerBtn">

⏲️ Start Timer

</button>

<div id="timerDisplay">

00:00

</div>

</div>

<script src="stopwatch.js"></script>

</body>
</html>
