<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Random Number Generator | ToolHub</title>

<link rel="stylesheet" href="random.css">

</head>
<body>

<header>

<h1>🎲 Random Number Generator</h1>

<p>Generate random numbers instantly.</p>

<a href="index.html" class="home-btn">

← Back to ToolHub

</a>

</header>

<div class="container">

<label>Minimum Number</label>

<input
type="number"
id="min"
placeholder="e.g. 1">

<label>Maximum Number</label>

<input
type="number"
id="max"
placeholder="e.g. 100">

<button id="generateBtn">

🎲 Generate

</button>

<div id="result">

<h2>Result</h2>

<p id="answer">

0

</p>

</div>

<div class="buttons">

<button id="copyBtn">

📋 Copy

</button>

<button id="clearBtn">

🗑️ Clear

</button>

</div>

</div>

<script src="random.js"></script>

</body>
</html>
