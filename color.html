<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colour Picker | ToolHub</title>

<link rel="stylesheet" href="color.css">

</head>

<body>

<header>

<h1>🎨 Colour Picker</h1>

<p>Pick, explore and copy colours instantly.</p>

<a href="index.html" class="home-btn">
← Back to ToolHub
</a>

</header>

<div class="container">

    <!-- COLOUR PREVIEW -->

    <div id="preview">

        <span id="previewText">
            #007BFF
        </span>

    </div>


    <!-- COLOUR INPUT -->

    <label for="colorPicker">
        Choose Colour
    </label>

    <input
        type="color"
        id="colorPicker"
        value="#007bff"
    >


    <!-- COLOUR CODES -->

    <div class="color-info">

        <div class="color-field">

            <label for="hex">
                HEX
            </label>

            <div class="input-row">

                <input
                    type="text"
                    id="hex"
                    readonly
                >

                <button id="copyHex">
                    📋
                </button>

            </div>

        </div>


        <div class="color-field">

            <label for="rgb">
                RGB
            </label>

            <div class="input-row">

                <input
                    type="text"
                    id="rgb"
                    readonly
                >

                <button id="copyRgb">
                    📋
                </button>

            </div>

        </div>


        <div class="color-field">

            <label for="hsl">
                HSL
            </label>

            <div class="input-row">

                <input
                    type="text"
                    id="hsl"
                    readonly
                >

                <button id="copyHsl">
                    📋
                </button>

            </div>

        </div>

    </div>


    <!-- COLOUR DETAILS -->

    <div class="details">

        <div class="detail-card">

            <span class="detail-label">
                Brightness
            </span>

            <strong id="brightness">
                0%
            </strong>

        </div>


        <div class="detail-card">

            <span class="detail-label">
                Lightness
            </span>

            <strong id="lightness">
                0%
            </strong>

        </div>

    </div>


    <!-- ACTION BUTTONS -->

    <div class="buttons">

        <button id="randomBtn">
            🎲 Random Colour
        </button>

        <button id="saveBtn">
            💾 Save Colour
        </button>

    </div>


    <!-- SAVED COLOURS -->

    <div class="saved-section">

        <h2>Saved Colours</h2>

        <p id="savedEmpty">
            No saved colours yet.
        </p>

        <div id="savedColors"></div>

    </div>


    <!-- RESET -->

    <button id="resetBtn">
        🔄 Reset
    </button>

</div>

<script src="color.js"></script>

</body>
</html>
